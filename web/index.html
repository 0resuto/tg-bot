<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Memory Bot — Interactive Simulator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel for JSX -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Vis.js Network for interactive Knowledge Graph -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0369a1',
              900: '#0c4a6e',
            },
            dark: {
              bg: '#0f172a',
              card: '#1e293b',
              border: '#334155',
              hover: '#283548'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for clean dark mode */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen font-sans antialiased flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PRESET_USERS = [
      { id: 1, name: "Alice", avatar: "👩", role: "Member" },
      { id: 2, name: "Bob", avatar: "👨", role: "Member" },
      { id: 3, name: "Charlie", avatar: "🧔", role: "Member" },
      { id: 10, name: "Admin", avatar: "👑", role: "Admin" },
    ];

    const getPresets = (botName) => [
      { label: "Alice coffee", text: "Я обожаю флэт уайт по утрам", user: "Alice" },
      { label: "Bob vacation", text: "Вчера вернулся из долгожданного отпуска в Риме!", user: "Bob" },
      { label: "Sensitive test", text: "Моя зарплата 150000 рублей, а пароль admin123", user: "Charlie" },
      { label: `Ask ${botName}`, text: `${botName}, что любит пить Алиса?`, user: "Bob" },
      { label: "Substring test", text: "Тракториста сегодня наградили за ударный труд", user: "Alice" },
    ];

    function App() {
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [currentUser, setCurrentUser] = useState(PRESET_USERS[0]);
      const [replyToBot, setReplyToBot] = useState(false);
      const [loading, setLoading] = useState(false);
      const [memories, setMemories] = useState([]);
      const [contextMessages, setContextMessages] = useState([]);
      const [stats, setStats] = useState(null);
      const [activeTab, setActiveTab] = useState("facts");
      const [forgetText, setForgetText] = useState("");
      const [sensitiveTestText, setSensitiveTestText] = useState("");
      const [sensitiveTestResult, setSensitiveTestResult] = useState(null);
      const [errorBanner, setErrorBanner] = useState(null);
      const [checkingHealth, setCheckingHealth] = useState(false);

      const [splitRatio, setSplitRatio] = useState(() => {
        try {
          const saved = localStorage.getItem("simulator_split_ratio");
          return saved ? Math.min(Math.max(parseFloat(saved), 20), 80) : 50;
        } catch (e) {
          return 50;
        }
      });
      const isDraggingRef = useRef(false);

      const handleDividerMouseDown = (e) => {
        e.preventDefault();
        isDraggingRef.current = true;
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";

        const onMouseMove = (moveEvent) => {
          if (!isDraggingRef.current) return;
          const containerWidth = window.innerWidth;
          let newRatio = (moveEvent.clientX / containerWidth) * 100;
          if (newRatio < 20) newRatio = 20;
          if (newRatio > 80) newRatio = 80;
          setSplitRatio(newRatio);
          if (networkRef.current) {
            try { networkRef.current.redraw(); } catch (err) {}
          }
        };

        const onMouseUp = () => {
          isDraggingRef.current = false;
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
          window.removeEventListener("mousemove", onMouseMove);
          window.removeEventListener("mouseup", onMouseUp);
          if (networkRef.current) {
            setTimeout(() => {
              try {
                networkRef.current.redraw();
                networkRef.current.fit();
              } catch (err) {}
            }, 60);
          }
        };

        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
      };

      useEffect(() => {
        try {
          localStorage.setItem("simulator_split_ratio", String(splitRatio));
        } catch (e) {}
      }, [splitRatio]);

      const refreshChecklist = async () => {
        setCheckingHealth(true);
        try {
          const res = await fetch("/api/checklist").then(r => r.json());
          setStats(prev => ({ ...prev, all_ready: res.all_ready, checklist: res.items }));
        } catch (e) {
          console.error("Checklist refresh failed", e);
        } finally {
          setCheckingHealth(false);
        }
      };

      const botName = (stats?.bot_names && stats.bot_names[0]) || "Bot";
      const currentPresets = getPresets(botName);

      const chatEndRef = useRef(null);

      // Auto scroll
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      // Load initial state & periodic poll
      const refreshData = async () => {
        try {
          const [memRes, ctxRes, statsRes] = await Promise.all([
            fetch("/api/memories").then(r => r.json()),
            fetch("/api/context").then(r => r.json()),
            fetch("/api/stats").then(r => r.json())
          ]);
          setMemories(memRes.facts || []);
          setContextMessages(ctxRes.messages || []);
          setStats(statsRes);
          if (statsRes.last_error && !errorBanner) {
            setErrorBanner({
              title: "Backend Alert",
              error: statsRes.last_error,
              details: null,
            });
          }
        } catch (e) {
          console.error("Failed to load initial data", e);
        }
      };

      useEffect(() => {
        refreshData();
        const interval = setInterval(refreshData, 4000);
        return () => clearInterval(interval);
      }, []);

      const [graphData, setGraphData] = useState({ nodes: [], edges: [], stats: {} });
      const [loadingGraph, setLoadingGraph] = useState(false);
      const [selectedGraphItem, setSelectedGraphItem] = useState(null);
      const [physicsEnabled, setPhysicsEnabled] = useState(true);
      const [graphFilter, setGraphFilter] = useState("all");

      const graphContainerRef = useRef(null);
      const networkRef = useRef(null);

      const fetchGraphData = async () => {
        setLoadingGraph(true);
        try {
          const res = await fetch("/api/graph").then(r => r.json());
          if (res.success) {
            setGraphData(res);
            setTimeout(() => {
              initOrUpdateNetwork(res.nodes, res.edges);
            }, 60);
          }
        } catch (err) {
          console.error("Failed to fetch graph data", err);
        } finally {
          setLoadingGraph(false);
        }
      };

      const initOrUpdateNetwork = (nodes, edges) => {
        if (!graphContainerRef.current || typeof vis === "undefined") return;

        let filteredNodes = nodes || [];
        if (graphFilter === "entities") {
          filteredNodes = filteredNodes.filter(n => n.group !== "Episodic");
        } else if (graphFilter === "episodes") {
          filteredNodes = filteredNodes.filter(n => n.group === "Episodic");
        } else if (graphFilter === "persons") {
          filteredNodes = filteredNodes.filter(n => n.group === "Person");
        } else if (graphFilter === "animals") {
          filteredNodes = filteredNodes.filter(n => n.group === "Animal");
        } else if (graphFilter === "items") {
          filteredNodes = filteredNodes.filter(n => n.group === "Item");
        } else if (graphFilter === "locations") {
          filteredNodes = filteredNodes.filter(n => n.group === "Location");
        } else if (graphFilter === "concepts") {
          filteredNodes = filteredNodes.filter(n => n.group === "Concept");
        }
        const nodeIds = new Set(filteredNodes.map(n => n.id));
        const filteredEdges = (edges || []).filter(e => nodeIds.has(e.from) && nodeIds.has(e.to));

        const data = {
          nodes: new vis.DataSet(filteredNodes),
          edges: new vis.DataSet(filteredEdges)
        };

        const options = {
          nodes: {
            shape: "dot",
            size: 22,
            font: { size: 12, color: "#f8fafc", strokeWidth: 2, strokeColor: "#0f172a" },
            borderWidth: 2,
            shadow: true
          },
          edges: {
            width: 2,
            font: { size: 10, color: "#94a3b8", align: "middle", background: "#0f172a", strokeWidth: 0 },
            arrows: { to: { enabled: true, scaleFactor: 0.8 } },
            smooth: { type: "continuous" },
            shadow: false
          },
          physics: {
            enabled: physicsEnabled,
            solver: "forceAtlas2Based",
            forceAtlas2Based: {
              gravitationalConstant: -100,
              centralGravity: 0.01,
              springLength: 180,
              springConstant: 0.05,
              avoidOverlap: 0.6
            },
            stabilization: { iterations: 120 }
          },
          interaction: {
            hover: true,
            tooltipDelay: 200,
            zoomView: true,
            dragView: true
          }
        };

        if (networkRef.current) {
          try { networkRef.current.destroy(); } catch (e) {}
        }

        const net = new vis.Network(graphContainerRef.current, data, options);
        networkRef.current = net;

        net.on("selectNode", function (params) {
          if (params.nodes.length > 0) {
            const nid = params.nodes[0];
            const found = nodes.find(n => n.id === nid);
            if (found) setSelectedGraphItem({ type: "node", data: found });
          }
        });

        net.on("selectEdge", function (params) {
          if (params.nodes.length === 0 && params.edges.length > 0) {
            const eid = params.edges[0];
            const found = edges.find(e => e.id === eid);
            if (found) setSelectedGraphItem({ type: "edge", data: found });
          }
        });

        net.on("deselectNode", function () {
          setSelectedGraphItem(null);
        });
        net.on("deselectEdge", function () {
          setSelectedGraphItem(null);
        });

        setTimeout(() => {
          try {
            net.redraw();
            net.fit();
          } catch (e) {}
        }, 150);
      };

      useEffect(() => {
        if (activeTab === "graph") {
          fetchGraphData();
        }
      }, [activeTab, graphFilter]);

      useEffect(() => {
        if (networkRef.current) {
          networkRef.current.setOptions({ physics: { enabled: physicsEnabled } });
        }
      }, [physicsEnabled]);

      const sendMessage = async (textToSend) => {
        const text = textToSend || inputText;
        if (!text.trim() || loading) return;

        setLoading(true);
        const optimisticId = Date.now();
        const optimisticMsg = {
          id: optimisticId,
          user_name: currentUser.name,
          text: text,
          timestamp: new Date().toISOString(),
          reply_to_bot: replyToBot,
        };

        setMessages(prev => [...prev, optimisticMsg]);
        if (!textToSend) setInputText("");

        try {
          const res = await fetch("/api/send_message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_id: currentUser.id,
              user_name: currentUser.name,
              text: text,
              reply_to_bot: replyToBot,
            })
          });
          const data = await res.json();

          if (!data.success && data.error) {
            setErrorBanner({
              title: "Error in Bot Execution",
              error: data.error,
              details: data.error_details,
            });
            setMessages(prev => prev.map(m => m.id === optimisticId ? {
              ...m,
              error: data.error,
              trigger_reason: data.trigger_reason,
            } : m));
          } else {
            setErrorBanner(null);
            setMessages(prev => prev.map(m => m.id === optimisticId ? {
              ...m,
              sensitive: data.sensitive_categories,
              is_addressed: data.is_addressed,
              trigger_reason: data.trigger_reason,
            } : m));

            if (data.bot_reply) {
              setMessages(prev => [
                ...prev,
                {
                  id: Date.now() + 1,
                  user_name: `${data.bot_names ? data.bot_names[0] : botName} (Bot)`,
                  text: data.bot_reply,
                  timestamp: new Date().toISOString(),
                  is_bot: true,
                }
              ]);
            }
          }
          refreshData();
        } catch (err) {
          console.error("Failed to send message", err);
          setErrorBanner({
            title: "Network / Connection Error",
            error: err.message || "Failed to reach simulator server.",
            details: String(err),
          });
        } finally {
          setLoading(false);
          setReplyToBot(false);
        }
      };

      const handleForget = async () => {
        if (!forgetText.trim()) return;
        try {
          const res = await fetch("/api/forget", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ description: forgetText })
          });
          const data = await res.json();
          alert(`Deleted ${data.deleted_count} facts matching "${forgetText}"`);
          setForgetText("");
          refreshData();
        } catch (e) {
          alert("Error deleting fact");
        }
      };

      const status = stats?.current_status || (loading ? "calling_llm" : "idle");

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          {/* Top Bar */}
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between shadow-sm">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-lg bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold text-lg">
                🤖
              </div>
              <div>
                <h1 className="text-base font-semibold text-white tracking-wide">Telegram Memory Bot — Simulator</h1>
                <p className="text-xs text-slate-400">Interactive Manual Testing & Diagnostics</p>
              </div>
            </div>

            <div className="flex items-center space-x-3 text-xs">
              {/* Bot Activity Status Badge */}
              <div className="flex items-center space-x-2 px-3 py-1 rounded-full bg-slate-800 border border-slate-700">
                <span className={`w-2.5 h-2.5 rounded-full ${
                  status === 'calling_llm' ? 'bg-yellow-400 animate-ping' :
                  status === 'ingesting_memory' ? 'bg-sky-400 animate-pulse' :
                  status === 'error' ? 'bg-red-500' :
                  'bg-emerald-400'
                }`}></span>
                <span className="text-slate-200 font-medium">
                  {status === 'calling_llm' ? '🟡 Calling LLM...' :
                   status === 'ingesting_memory' ? '🔵 Updating Memory...' :
                   status === 'error' ? '🔴 Error' :
                   '🟢 Ready (Listening)'}
                </span>
              </div>

              {/* Active LLM Model */}
              <div className="flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700">
                <span className="text-slate-400">🤖 LLM:</span>
                <strong className="text-emerald-400 font-mono text-xs">{stats?.llm_model || 'OpenAI'}</strong>
              </div>

              {/* Memory Backend */}
              <div className="hidden md:flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700">
                <span className="text-slate-400">🧠 Memory:</span>
                <span className="text-sky-300 text-xs">{stats?.memory_backend || 'In-Memory'}</span>
              </div>

              {/* Listening For Names */}
              <div className="hidden sm:flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700">
                <span className="text-slate-400">Names:</span>
                <strong className="text-sky-300">{(stats?.bot_names || [botName]).join(", ")}</strong>
              </div>

              <div className="text-slate-400">
                Facts: <strong className="text-sky-400">{memories.length}</strong>
              </div>
            </div>
          </header>

          {/* SYSTEM HEALTH CHECKLIST (Production Stack, Zero Fallbacks) */}
          <div className="bg-slate-900/90 border-b border-slate-800 px-6 py-3">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center space-x-2.5">
                <span className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center space-x-1.5">
                  <span>🛠️</span>
                  <span>System Health Checklist</span>
                </span>
                <span className={`text-[11px] px-2 py-0.5 rounded-full font-medium border ${
                  stats?.all_ready
                    ? 'bg-emerald-950/80 text-emerald-300 border-emerald-700/60'
                    : 'bg-red-950/80 text-red-300 border-red-700/60 animate-pulse'
                }`}>
                  {stats?.all_ready ? '✅ All Production Services Healthy (Zero Fallbacks)' : '❌ System Degraded — Messages Blocked'}
                </span>
              </div>
              <button
                onClick={refreshChecklist}
                disabled={checkingHealth}
                className="text-xs bg-slate-800 hover:bg-slate-700 text-sky-400 px-2.5 py-1 rounded border border-slate-700 flex items-center space-x-1.5 transition-all disabled:opacity-50"
              >
                <span>{checkingHealth ? '⏳' : '🔄'}</span>
                <span>{checkingHealth ? 'Testing Services...' : 'Re-check Services'}</span>
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
              {(stats?.checklist || [
                { id: 'openai', name: 'OpenAI LLM', target: '...', status: 'unknown', message: 'Checking...' },
                { id: 'postgres', name: 'PostgreSQL Database', target: '...', status: 'unknown', message: 'Checking...' },
                { id: 'redis', name: 'Redis Context & Buffer', target: '...', status: 'unknown', message: 'Checking...' },
                { id: 'neo4j', name: 'Neo4j / Graphiti Memory', target: '...', status: 'unknown', message: 'Checking...' },
              ]).map(item => (
                <div
                  key={item.id}
                  className={`p-2.5 rounded-lg border flex flex-col justify-between transition-all ${
                    item.status === 'ok'
                      ? 'bg-slate-950/50 border-emerald-900/50 hover:border-emerald-800'
                      : 'bg-red-950/30 border-red-800/80 shadow-inner'
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <span className="font-semibold text-xs text-slate-200 flex items-center space-x-1">
                      <span>{item.id === 'openai' ? '🤖' : item.id === 'postgres' ? '🐘' : item.id === 'redis' ? '⚡' : '🕸️'}</span>
                      <span>{item.name}</span>
                    </span>
                    <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${
                      item.status === 'ok'
                        ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/50'
                        : 'bg-red-900 text-red-200 border border-red-700'
                    }`}>
                      {item.status === 'ok' ? 'ONLINE' : 'OFFLINE'}
                    </span>
                  </div>
                  <div className="mt-1 text-[11px] font-mono text-slate-400 truncate" title={item.target}>
                    {item.target}
                  </div>
                  <div className={`mt-0.5 text-[11px] leading-tight ${
                    item.status === 'ok' ? 'text-slate-400' : 'text-red-300 font-medium'
                  }`}>
                    {item.error || item.message}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Main Content Split Screen */}
          <div className="flex-1 flex overflow-hidden relative">
            {/* Left: Chat Simulator Panel */}
            <div
              style={{ width: `${splitRatio}%` }}
              className="flex flex-col bg-slate-950 flex-shrink-0 min-w-[280px]"
            >
              {/* Error Banner if any */}
              {errorBanner && (
                <div className="bg-red-950/90 border-b border-red-800 p-3 text-xs text-red-200 flex items-start justify-between">
                  <div className="flex-1 pr-2">
                    <div className="font-bold flex items-center space-x-1 text-red-300">
                      <span>⚠️</span>
                      <span>{errorBanner.title}</span>
                    </div>
                    <div className="mt-1 font-mono text-[11px] text-red-200 whitespace-pre-wrap">{errorBanner.error}</div>
                    {errorBanner.details && (
                      <details className="mt-2 text-[10px] text-slate-400">
                        <summary className="cursor-pointer hover:underline text-red-400 font-semibold">Click to view Traceback</summary>
                        <pre className="mt-1 p-2 bg-black/70 rounded text-[10px] text-red-300 overflow-x-auto whitespace-pre-wrap font-mono">{errorBanner.details}</pre>
                      </details>
                    )}
                  </div>
                  <button onClick={() => setErrorBanner(null)} className="text-red-400 hover:text-white text-base font-bold px-1.5 py-0.5 rounded">✕</button>
                </div>
              )}

              {/* User Switcher Bar */}
              <div className="bg-slate-900/60 border-b border-slate-800 p-3 flex items-center justify-between text-xs">
                <div className="flex items-center space-x-2">
                  <span className="text-slate-400">Speak as:</span>
                  <div className="flex space-x-1.5">
                    {PRESET_USERS.map(u => (
                      <button
                        key={u.id}
                        onClick={() => setCurrentUser(u)}
                        className={`px-2.5 py-1 rounded-md transition-all flex items-center space-x-1 ${
                          currentUser.id === u.id
                            ? 'bg-sky-500 text-white font-medium shadow-sm'
                            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                        }`}
                      >
                        <span>{u.avatar}</span>
                        <span>{u.name}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <label className="flex items-center space-x-1.5 text-slate-300 cursor-pointer select-none">
                  <input
                    type="checkbox"
                    checked={replyToBot}
                    onChange={e => setReplyToBot(e.target.checked)}
                    className="rounded bg-slate-800 border-slate-700 text-sky-500 focus:ring-0 cursor-pointer"
                  />
                  <span>Reply to Bot</span>
                </label>
              </div>

              {/* Chat Message Stream */}
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {messages.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-slate-500 text-sm">
                    <span className="text-3xl mb-2">💬</span>
                    <span>No messages yet in this session.</span>
                    <span className="text-xs text-slate-600 mt-1">Pick a user, write a message or try a preset below!</span>
                  </div>
                ) : (
                  messages.map(m => (
                    <div
                      key={m.id}
                      className={`flex flex-col ${m.is_bot ? 'items-start' : 'items-end'}`}
                    >
                      <div className="text-[11px] text-slate-400 mb-0.5 px-1">
                        {m.user_name}
                      </div>
                      <div
                        className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-sm shadow-sm relative ${
                          m.is_bot
                            ? 'bg-slate-800 text-sky-100 border border-slate-700 rounded-tl-sm'
                            : 'bg-sky-600 text-white rounded-tr-sm'
                        }`}
                      >
                        <div>{m.text}</div>
                        {m.sensitive && m.sensitive.length > 0 && (
                          <div className="mt-1.5 pt-1.5 border-t border-red-400/30 flex items-center space-x-1 text-[11px] text-red-200">
                            <span>🛡️ Flagged sensitive:</span>
                            <span className="font-semibold uppercase tracking-wider">{m.sensitive.join(", ")}</span>
                          </div>
                        )}
                      </div>

                      {/* Decision and Status explanation below each user message */}
                      {!m.is_bot && (
                        <div className="mt-1 px-1 text-[10px] max-w-[85%]">
                          {m.error ? (

                            {log.error && (
                              <div className="text-red-400 font-mono text-[10px] mt-1 bg-red-950/60 p-2 rounded whitespace-pre-wrap">
                                {log.error}
                              </div>
                            )}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}

                {activeTab === "admin" && (
                  <div className="space-y-5 text-xs">
                    {/* Forget Fact Tool */}
                    <div className="bg-slate-800/50 border border-slate-700 rounded-lg p-4">
                      <h3 className="text-sm font-semibold text-white mb-1">🗑️ /forget_fact Simulator</h3>
                      <p className="text-slate-400 mb-3 text-[11px]">
                        Admin command to delete facts matching a description from the knowledge graph.
                      </p>
                      <div className="flex space-x-2">
                        <input
                          type="text"
                          value={forgetText}
                          onChange={e => setForgetText(e.target.value)}
                          placeholder="e.g. coffee preference or Rome"
                          className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white placeholder-slate-500"
                        />
                        <button
                          onClick={handleForget}
                          className="px-3 py-1.5 bg-red-600/80 hover:bg-red-600 text-white rounded font-medium"
                        >
                          Forget Fact
                        </button>
                      </div>
                    </div>

                    {/* Sensitive Filter Live Test */}
                    <div className="bg-slate-800/50 border border-slate-700 rounded-lg p-4">
                      <h3 className="text-sm font-semibold text-white mb-1">🛡️ Sensitive Topics Filter Check</h3>
                      <p className="text-slate-400 mb-3 text-[11px]">
                        Type any text below to see if our rule-based filter identifies it as sensitive (Health, Finance, Credentials, Legal, Sexual, Political).
                      </p>
                      <input
                        type="text"
                        value={sensitiveTestText}
                        onChange={async (e) => {
                          const val = e.target.value;
                          setSensitiveTestText(val);
                          if (!val.trim()) {
                            setSensitiveTestResult(null);
                            return;
                          }
                          const hasHealth = /диагноз|боле|диабет|лекарств|таблетк|врач|health|medical|disease/i.test(val);
                          const hasFinance = /зарплат|доход|кредит|рубл|доллар|\$|salary|income|debt|bank/i.test(val);
                          const hasCreds = /парол|password|secret|token|api_key/i.test(val);
                          const cats = [];
                          if (hasHealth) cats.push("HEALTH");
                          if (hasFinance) cats.push("FINANCE");
                          if (hasCreds) cats.push("CREDENTIALS (SKIP)");
                          setSensitiveTestResult(cats);
                        }}
                        placeholder="Test a phrase (e.g. 'Моя зарплата 100k')..."
                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-white placeholder-slate-500 mb-2"
                      />
                      {sensitiveTestResult && (
                        <div className="mt-2 p-2 rounded bg-slate-900/80 border border-slate-700 text-xs">
                          {sensitiveTestResult.length > 0 ? (
                            <div className="text-amber-400 flex items-center space-x-1">
                              <span>⚠️ Detected Categories:</span>
                              <strong>{sensitiveTestResult.join(", ")}</strong>
                            </div>
                          ) : (
                            <div className="text-emerald-400">
                              ✅ Clean — safe for memory ingestion.
                            </div>
                          )}
                        </div>
                      )}
                    </div>

                    {/* Stats */}
                    <div className="bg-slate-800/50 border border-slate-700 rounded-lg p-4">
                      <h3 className="text-sm font-semibold text-white mb-2">📊 /memory_stats Diagnostic</h3>
                      <pre className="p-3 bg-slate-950 rounded text-slate-300 font-mono text-[11px] overflow-x-auto">
                        {JSON.stringify(stats, null, 2)}
                      </pre>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
